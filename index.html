<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고대 세종 셔틀버스</title>
    
    <!-- PWA 설정 -->
    <meta name="theme-color" content="#000000">
    <meta name="description" content="고대 세종 셔틀버스 시간표">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="KUSBUS">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <link rel="stylesheet" href="style.css">
     <link href="css/bootstrap.min.css" rel="stylesheet">
     <script src="js/bootstrap.bundle.min.js"></script>
     <script src="js/jquery-3.7.0.js"></script>
     <link href="css/maru-buri.css" rel="stylesheet">
     
</head>
<body>
    
    

    <br><br><br><br>
    <h2 class="kusbus">KUSBUS (2026-1)</h2>
    <!-- <h2><span class="kusbus">KUSBUS </span>(2024-1)</h2> -->
    <br>
    
    <h2 id="clock"></h2>
    <button class='btn-outline-dark btn' id="openImageModal">이미지로 보기</button>
    
    <br>
    <div class="center">
        <h2>학교 → 조치원역</h2>
        <p id="toStationCurrentTargetTime"></p>
        <p id="toStationRemainingTime"></p>
        <p id="toStationNextTargetTime"></p>
    </div>
    <br>
    <div class="center">
        <h2>조치원역 → 학교</h2>
        <p id="toSchoolCurrentTargetTime"></p>
        <p id="toSchoolRemainingTime"></p>
        <p id="toSchoolNextTargetTime"></p>
    </div>

    <a class="btn-outline-danger btn" href="https://gpa.korea.ac.kr/koreaSejong/8028/subview.do">식단표</a>
    <br>
    
    <!-- 이미지 모달 -->
    <dialog id="imageModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>버스 시간표</h3>
                <button class="modal-close" id="closeImageModal" aria-label="닫기">&times;</button>
            </div>
            <div class="modal-body">
                <img src="busschedule/busSchedule.png" alt="버스 시간표" class="bus-schedule-image">
            </div>
        </div>
    </dialog>
    
    <!-- PWA 설치 토스트 -->
    <div id="installToast" class="install-toast" style="display: none;">
        <div class="install-toast-content">
            <div class="install-toast-icon">📱</div>
            <div class="install-toast-text">
                <strong>앱으로 설치하기</strong>
                <span>오프라인에서도 사용할 수 있어요!</span>
            </div>
            <div class="install-toast-buttons">
                <button id="installBtn" class="install-btn">설치</button>
                <button id="dismissInstallBtn" class="dismiss-btn" aria-label="닫기">&times;</button>
            </div>
        </div>
    </div>
    
    <!-- 출처 표기 -->
    <footer style="margin-top: 2rem; padding: 1rem; text-align: center; color: #666; font-size: 0.875rem;">
        <p>원본 출처: <a href="https://kusbus.netlify.app/" target="_blank" rel="noopener noreferrer">https://kusbus.netlify.app/</a></p>
    </footer>
    <br>
    
    <script src="app.js"></script>
    <script>
        // Service Worker 등록
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then((registration) => {
                        console.log('Service Worker 등록 성공:', registration.scope);
                    })
                    .catch((error) => {
                        console.log('Service Worker 등록 실패:', error);
                    });
            });
        }
        
        // 이미지 모달 제어
        const imageModal = document.getElementById('imageModal');
        const openImageModalBtn = document.getElementById('openImageModal');
        const closeImageModalBtn = document.getElementById('closeImageModal');
        
        openImageModalBtn.addEventListener('click', () => {
            imageModal.showModal();
        });
        
        closeImageModalBtn.addEventListener('click', () => {
            imageModal.close();
        });
        
        // 모달 배경 클릭 시 닫기
        imageModal.addEventListener('click', (event) => {
            if (event.target === imageModal) {
                imageModal.close();
            }
        });
        
        // ESC 키로 닫기
        imageModal.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                imageModal.close();
            }
        });
        
        // PWA 설치 토스트
        let deferredPrompt;
        const installToast = document.getElementById('installToast');
        const installBtn = document.getElementById('installBtn');
        const dismissInstallBtn = document.getElementById('dismissInstallBtn');
        
        // 이미 설치되어 있는지 확인
        function isInstalled() {
            return window.matchMedia('(display-mode: standalone)').matches || 
                   window.navigator.standalone === true ||
                   document.referrer.includes('android-app://');
        }
        
        // 로컬 스토리지에서 설치 토스트 거부 여부 확인
        function wasInstallDismissed() {
            return localStorage.getItem('pwa-install-dismissed') === 'true';
        }
        
        // 설치 토스트 표시
        function showInstallToast() {
            if (!isInstalled() && !wasInstallDismissed() && deferredPrompt) {
                installToast.style.display = 'block';
                setTimeout(() => {
                    installToast.classList.add('show');
                }, 100);
            }
        }
        
        // 설치 토스트 숨기기
        function hideInstallToast() {
            installToast.classList.remove('show');
            setTimeout(() => {
                installToast.style.display = 'none';
            }, 300);
        }
        
        // beforeinstallprompt 이벤트 감지
        window.addEventListener('beforeinstallprompt', (e) => {
            // 기본 프롬프트 방지
            e.preventDefault();
            // 이벤트 저장
            deferredPrompt = e;
            // 3초 후 토스트 표시
            setTimeout(showInstallToast, 3000);
        });
        
        // 설치 버튼 클릭
        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) {
                return;
            }
            
            // 설치 프롬프트 표시
            deferredPrompt.prompt();
            
            // 사용자 선택 대기
            const { outcome } = await deferredPrompt.userChoice;
            
            if (outcome === 'accepted') {
                console.log('사용자가 PWA 설치를 승인했습니다');
            } else {
                console.log('사용자가 PWA 설치를 거부했습니다');
            }
            
            // 이벤트 초기화
            deferredPrompt = null;
            hideInstallToast();
        });
        
        // 닫기 버튼 클릭
        dismissInstallBtn.addEventListener('click', () => {
            localStorage.setItem('pwa-install-dismissed', 'true');
            hideInstallToast();
        });
        
        // 설치 완료 감지
        window.addEventListener('appinstalled', () => {
            console.log('PWA가 설치되었습니다');
            deferredPrompt = null;
            hideInstallToast();
        });
    </script>
</body>
</html>
